<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Synth Zed — 16 px simplification</title>
  <desc id="description">The carved Z on a 64-unit grid: box 192..832, a 320-unit (five-pixel) band and square carve corners, so edges land on whole pixels at 16 px.</desc>
  <g id="foundation">
    <rect x="64" y="64" width="896" height="896" rx="184" fill="#101014"/>
  </g>
  <g id="glyph" fill="#FFFFFF">
      <path d="M 512,192 H 832 L 512,832 H 192 Z"/>
  </g>
  <g id="accent" fill="#1FD3F2">
      <path d="M 192,192 L 512,192 C 400,416 371.2,448 192,448 L 192,192 A 0 0 0 0 1 192,192 Z"/>
      <path d="M 832,832 L 512,832 C 624,608 652.8,576 832,576 L 832,832 A 0 0 0 0 1 832,832 Z"/>
  </g>
</svg>
