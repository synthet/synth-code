<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title description">
  <title id="title">Synth Code — macOS icon</title>
  <desc id="description">Synth fork icon family. Flat near-black plate, silver glyph, transparent surround. The mark is the Synth Code window: a rounded frame around a code slash, &lt;/&gt;, drawn as vector geometry. The channel tint recolours the whole glyph. All visible artwork is vector geometry.</desc>
